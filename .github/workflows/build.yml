name: BC CI/CD Pipeline

# ---------------------------------------------------------------------------
# CI/CD pipeline for the SACCO Ledger Business Central AL project.
# Build & test run in a fresh BC sandbox Docker container on a Windows runner.
# On push to main, the compiled app is deployed to the local bc270 container
# via the self-hosted runner, using BcContainerHelper.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AL_PROJECT_FOLDER: '.'
  # GitHub-hosted Windows runners check out the repo to the D: drive, but Windows
  # containers can only bind-mount folders on C:.
  BUILD_FOLDER: 'C:\bcbuild'
  CONTAINER_NAME: 'saccoci'
  CONTAINER_USER: 'admin'
  CONTAINER_PASSWORD: 'P@ssw0rdCICD123!'   # only used inside the ephemeral build container

jobs:
  build-and-test:
    runs-on: windows-2022
    outputs:
      app_version: ${{ steps.bumpversion.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install BcContainerHelper
        shell: powershell
        run: |
          Install-Module BcContainerHelper -Force -AllowClobber -Scope CurrentUser
          Import-Module BcContainerHelper

      - name: 'Copy project to C: drive'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:BUILD_FOLDER -Force | Out-Null
          Copy-Item -Path (Join-Path $env:AL_PROJECT_FOLDER "*") -Destination $env:BUILD_FOLDER -Recurse -Force
          Write-Host "Project copied to $env:BUILD_FOLDER"
          Get-ChildItem $env:BUILD_FOLDER

      - name: Read app.json
        id: appjson
        shell: powershell
        run: |
          $appJsonPath = Join-Path $env:BUILD_FOLDER "app.json"
          $appJson = Get-Content $appJsonPath -Raw | ConvertFrom-Json
          "app_name=$($appJson.name)" >> $env:GITHUB_OUTPUT
          "app_version=$($appJson.version)" >> $env:GITHUB_OUTPUT

      - name: Bump version using run number
        id: bumpversion
        shell: powershell
        run: |
          $appJsonPath = Join-Path $env:BUILD_FOLDER "app.json"
          $appJson = Get-Content $appJsonPath -Raw | ConvertFrom-Json

          $parts = $appJson.version -split '\.'
          $newVersion = "$($parts[0]).$($parts[1]).$($parts[2]).${{ github.run_number }}"
          $appJson.version = $newVersion

          $appJson | ConvertTo-Json -Depth 10 | Set-Content -Path $appJsonPath -Encoding UTF8

          Write-Host "Version bumped: $newVersion"
          "app_version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Create BC sandbox container
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          $credential = New-Object PSCredential($env:CONTAINER_USER, (ConvertTo-SecureString $env:CONTAINER_PASSWORD -AsPlainText -Force))
          $volumeMount = "--volume `"$($env:BUILD_FOLDER):$($env:BUILD_FOLDER)`""
          New-BcContainer `
            -accept_eula `
            -containerName $env:CONTAINER_NAME `
            -artifactUrl (Get-BcArtifactUrl -type Sandbox -country us -select Latest) `
            -auth UserPassword `
            -Credential $credential `
            -updateHosts `
            -includeTestToolkit `
            -additionalParameters @($volumeMount)

      - name: Compile app
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          $credential = New-Object PSCredential($env:CONTAINER_USER, (ConvertTo-SecureString $env:CONTAINER_PASSWORD -AsPlainText -Force))
          Compile-AppInBcContainer `
            -containerName $env:CONTAINER_NAME `
            -credential $credential `
            -appProjectFolder $env:BUILD_FOLDER `
            -appOutputFolder (Join-Path $env:BUILD_FOLDER "output") `
            -EnableCodeCop `
            -EnableAppSourceCop:$false

      - name: Publish app to container
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          $credential = New-Object PSCredential($env:CONTAINER_USER, (ConvertTo-SecureString $env:CONTAINER_PASSWORD -AsPlainText -Force))
          $appFile = Get-ChildItem -Path (Join-Path $env:BUILD_FOLDER "output") -Filter *.app | Select-Object -First 1
          Publish-BcContainerApp `
            -containerName $env:CONTAINER_NAME `
            -credential $credential `
            -appFile $appFile.FullName `
            -skipVerification `
            -install `
            -sync

      - name: List discovered tests (diagnostic)
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          $credential = New-Object PSCredential($env:CONTAINER_USER, (ConvertTo-SecureString $env:CONTAINER_PASSWORD -AsPlainText -Force))

          Write-Host "Apps installed in container:"
          Get-BcContainerAppInfo -containerName $env:CONTAINER_NAME | Format-Table Name, Publisher, Version, ExtensionId

          Write-Host ""
          Write-Host "Test codeunits discovered:"
          Get-TestsFromBCContainer -containerName $env:CONTAINER_NAME -credential $credential | Format-Table -AutoSize

      - name: Run automated tests
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          $credential = New-Object PSCredential($env:CONTAINER_USER, (ConvertTo-SecureString $env:CONTAINER_PASSWORD -AsPlainText -Force))
          $results = Run-TestsInBcContainer `
            -containerName $env:CONTAINER_NAME `
            -credential $credential `
            -detailed `
            -returnTrueIfAllPassed

          Write-Host "All tests passed: $results"

          if (-not $results) {
            throw "One or more tests failed. Failing the pipeline."
          }

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: sacco-app
          path: ${{ env.BUILD_FOLDER }}\output\*.app
          if-no-files-found: error

      - name: Remove build container
        if: always()
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          Remove-BcContainer -containerName $env:CONTAINER_NAME -ErrorAction SilentlyContinue

  deploy:
    needs: build-and-test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: sacco-app
          path: ./output
      - name: Deploy to local bc270 container
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          $credential = New-Object PSCredential("Leilah", (ConvertTo-SecureString "${{ secrets.BC_PASSWORD }}" -AsPlainText -Force))

          $appFile = Get-ChildItem -Path "./output" -Filter *.app | Select-Object -First 1
          Write-Host "Deploying $($appFile.Name) to bc270"

          $ErrorActionPreference = "Stop"

          try {
            Publish-BcContainerApp `
              -containerName "bc270" `
              -credential $credential `
              -appFile $appFile.FullName `
              -skipVerification `
              -install `
              -sync `
              -syncMode ForceSync
            Write-Host "Published and installed successfully (fresh install)."
          } catch {
            if ($_.Exception.Message -match "already uses a different version") {
              Write-Host "A different version is already installed - retrying with -upgrade."
              Publish-BcContainerApp `
                -containerName "bc270" `
                -credential $credential `
                -appFile $appFile.FullName `
                -skipVerification `
                -install `
                -sync `
                -syncMode ForceSync `
                -upgrade
              Write-Host "Upgraded successfully."
            } elseif ($_.Exception.Message -match "already installed") {
              Write-Host "This exact version is already installed - nothing to do."
            } else {
              throw
            }
          }

          Write-Host "Deploy step completed."

      - name: Verify installation
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          $appFile = Get-ChildItem -Path "./output" -Filter *.app | Select-Object -First 1

          $installed = Get-BcContainerAppInfo -containerName "bc270" |
                       Where-Object { $_.Name -eq "Sacco" -and $_.IsInstalled -eq $true }

          if (-not $installed) {
            throw "Verification failed: app is not showing as installed on bc270."
          }

          Write-Host "Verified: $($installed.Name) v$($installed.Version) is installed on bc270."