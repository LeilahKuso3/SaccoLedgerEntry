name: BC CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------- CI: Build and Test ----------
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bump version using run number
        id: bumpversion
        shell: powershell
        run: |
          $appJsonPath = Join-Path $env:GITHUB_WORKSPACE "app.json"
          $appJson = Get-Content $appJsonPath -Raw | ConvertFrom-Json

          # Keep Major.Minor.Build from app.json, replace only the Revision segment
          # with the GitHub run number, e.g. 1.0.0.0 -> 1.0.0.247
          $parts = $appJson.version -split '\.'
          $newVersion = "$($parts[0]).$($parts[1]).$($parts[2]).${{ github.run_number }}"
          $appJson.version = $newVersion

          $appJson | ConvertTo-Json -Depth 10 | Set-Content -Path $appJsonPath -Encoding UTF8

          Write-Host "Version bumped: $newVersion"
          "app_version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Install BcContainerHelper
        shell: powershell
        run: |
          Install-Module BcContainerHelper -Force -AcceptLicense

      - name: Create BC container
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          $artifactUrl = Get-BcArtifactUrl -country "us" -select Latest
          New-BcContainer `
            -accept_eula `
            -containerName "saccoci" `
            -auth NavUserPassword `
            -Credential (New-Object PSCredential "admin", (ConvertTo-SecureString "${{ secrets.BC_PASSWORD }}" -AsPlainText -Force))

      - name: Compile app
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          Compile-AppInBcContainer `
            -containerName "saccoci" `
            -credential (New-Object PSCredential "admin", (ConvertTo-SecureString "${{ secrets.BC_PASSWORD }}" -AsPlainText -Force)) `
            -appProjectFolder $env:GITHUB_WORKSPACE `
            -appOutputFolder (Join-Path $env:GITHUB_WORKSPACE "output") `
            -EnableCodeCop `
            -EnableAppSourceCop:$false

      - name: Publish app to test instance
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          Publish-BcContainerApp `
            -containerName "saccoci" `
            -appFile (Join-Path $env:GITHUB_WORKSPACE "output\*.app") `
            -skipVerification `
            -install `
            -sync

      - name: Run AL tests
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          Run-TestsInBcContainer `
            -containerName "saccoci" `
            -credential (New-Object PSCredential "admin", (ConvertTo-SecureString "${{ secrets.BC_PASSWORD }}" -AsPlainText -Force)) `
            -testCodeunit "Member Journal Post Tests"

      - name: Upload compiled app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sacco-app
          path: ${{ github.workspace }}\output\*.app

      - name: Remove container
        if: always()
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          Remove-BcContainer -containerName "saccoci"

  # ---------- CD: Deploy ----------
  deploy:
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - name: Download compiled app
        uses: actions/download-artifact@v4
        with:
          name: sacco-app
          path: ./output

      - name: Install BcContainerHelper
        shell: powershell
        run: |
          Install-Module BcContainerHelper -Force -AcceptLicense

      - name: Create deployment container
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          New-BcContainer `
            -accept_eula `
            -containerName "saccoprod" `
            -auth NavUserPassword `
            -Credential (New-Object PSCredential "admin", (ConvertTo-SecureString "${{ secrets.BC_PASSWORD }}" -AsPlainText -Force))

      - name: Deploy to Business Central
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          Publish-BcContainerApp `
            -containerName "saccoprod" `
            -appFile "./output/*.app" `
            -skipVerification `
            -install `
            -sync `
            -syncMode ForceSync

      - name: Remove container
        if: always()
        shell: powershell
        run: |
          Import-Module BcContainerHelper
          Remove-BcContainer -containerName "saccoprod"